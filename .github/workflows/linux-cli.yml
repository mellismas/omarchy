name: Linux CLI fixtures

on:
  pull_request:
  push:
    branches: [quattro]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-cli:
    name: Native Linux CLI fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Prepare native fixture tools without system installation
        run: |
          mkdir -p "$RUNNER_TEMP/cli-tools"
          cd "$RUNNER_TEMP/cli-tools"
          apt-get download ripgrep
          dpkg-deb --extract ripgrep_*.deb .
          echo "$RUNNER_TEMP/cli-tools/usr/bin" >> "$GITHUB_PATH"
      - name: Run CLI and editor fixtures
        run: |
          ./test/cli
          ./test/shell.d/vscode-theme-test.sh

  arch-cli:
    name: Arch Linux CLI fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:base
    steps:
      # Package installation is confined to this disposable job container.
      - name: Prepare Arch fixture dependencies
        run: pacman -Syu --noconfirm --needed git jq python ripgrep diffutils fontconfig
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Run CLI and editor fixtures
        run: |
          ./test/cli
          ./test/shell.d/vscode-theme-test.sh

# These synthetic fixtures do not establish desktop/session, PAM, camera,
# TPM, or biometric acceptance; those require the real Omarchy target.
